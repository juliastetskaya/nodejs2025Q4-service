version: '3.8'

services:
  postgres:
    build:
      context: ./prisma
      dockerfile: Dockerfile
    container_name: nodejs2025q4-postgres
    restart: always
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nest:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs2025q4-nest
    restart: always
    ports:
      - ${PORT}:${PORT}
    env_file:
      - .env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-LOG}
      - LOG_MAX_FILE_SIZE=${LOG_MAX_FILE_SIZE:-1024}
    volumes:
      - nest_data:/usr/app
      - ./src:/usr/app/src
      - logs_data:/usr/app/logs
    networks:
      - app-network

volumes:
  postgres_data:
  nest_data:
  logs_data:

networks:
  app-network:
    driver: bridge
